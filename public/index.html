<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo Stats</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 640px);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
        font-weight: 700;
      }

      .stats {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        margin: 0 0 24px;
      }

      .stat {
        background: #ffffff;
        border: 1px solid #d8dee9;
        border-radius: 8px;
        padding: 18px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        color: #566174;
        font-size: 0.9rem;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #1f6feb;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
      }

      button:disabled {
        background: #8aa9d6;
        cursor: wait;
      }

      button:focus-visible {
        outline: 3px solid #f6c945;
        outline-offset: 2px;
      }

      #status {
        min-height: 1.4em;
        color: #566174;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo Stats</h1>
      <section class="stats" aria-label="Todo counts">
        <div class="stat">
          <span class="label">Total</span>
          <span class="value" id="total">0</span>
        </div>
        <div class="stat">
          <span class="label">Completed</span>
          <span class="value" id="completed">0</span>
        </div>
        <div class="stat">
          <span class="label">Active</span>
          <span class="value" id="active">0</span>
        </div>
      </section>
      <div class="actions">
        <button id="refresh" type="button" aria-label="Refresh todo statistics">Refresh</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
